[www]
user = nobody
group = nobody

; C'est LA ligne importante : écouter sur le port 9000 de toutes les interfaces
listen = 9000

; Gestion des processus (standard pour Docker)
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Logs (pour voir les erreurs dans 'docker logs')
catch_workers_output = yes