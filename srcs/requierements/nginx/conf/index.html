<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Welcome to 42 Inception</title>
	<style>
		/* Base and background */
		:root{
			--bg:#000; /* black */
			--green:#00ff66; /* hacker green */
			--muted-green:#0b3;
			--glass: rgba(0,255,102,0.04);
		}
		html,body{height:100%;margin:0;font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", monospace;background:var(--bg);color:var(--green);overflow:hidden}

		/* full-bleed canvas for matrix rain */
		canvas#matrix{position:fixed;inset:0;z-index:0;display:block}

		/* center layout */
		.stage{
			position:relative;z-index:2;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:3rem;box-sizing:border-box
		}

		/* Neon / glass card */
		.card{
			backdrop-filter: blur(6px) saturate(1.1);
			background:linear-gradient(135deg, rgba(0,255,102,0.02), rgba(0,0,0,0.25));
			border:1px solid rgba(0,255,102,0.08);
			padding:2.5rem 3.5rem;border-radius:18px;box-shadow:0 10px 60px rgba(0,255,102,0.03);max-width:1000px
		}

		/* Main big title */
		.title{
			font-size:clamp(2.2rem,6vw,5rem);letter-spacing:0.06em;line-height:0.9;margin:0;color:var(--green);position:relative;text-shadow:
				 0 0 8px rgba(0,255,102,0.08),
				 0 0 24px rgba(0,255,102,0.06),
				 0 0 48px rgba(0,255,102,0.03);
			font-weight:700
		}

		/* subline terminal */
		.terminal{
			margin-top:1rem;font-size:1rem;opacity:0.85;display:flex;gap:0.6rem;align-items:center;justify-content:center
		}
		.cursor{width:10px;height:18px;background:var(--green);display:inline-block;animation:blink 0.9s steps(1) infinite}
		@keyframes blink{50%{opacity:0}}

		/* flicker overlay */
		.flicker{position:fixed;inset:0;pointer-events:none;mix-blend-mode:screen;z-index:3;background-image:radial-gradient(circle at 10% 10%, rgba(0,255,102,0.02),transparent 6%),radial-gradient(circle at 90% 90%, rgba(0,255,102,0.01),transparent 10%);opacity:0.9}

		/* small footer */
		.meta{margin-top:1.6rem;font-size:0.8rem;color:rgba(0,255,102,0.6);opacity:0.9}

		/* responsive */
		@media (max-width:520px){.card{padding:1.4rem;border-radius:12px}.terminal{flex-direction:column}.meta{font-size:0.75rem}}
	</style>
</head>
<body>
	<canvas id="matrix"></canvas>
	<div class="stage">
		<div class="card" role="main" aria-label="Welcome to 42 Inception">
			<h1 class="title">Welcome to 42 Inception</h1>
			<div class="terminal" aria-hidden="false">
				<div id="typed">Initializing</div>
				<div class="cursor" aria-hidden="true"></div>
			</div>
			<div class="meta">System: 42 · Layer: Inception · Mode: ∞</div>
		</div>
	</div>
	<div class="flicker"></div>
</body>
</html>
